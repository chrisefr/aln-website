[build]
  # Regenerates individuals/, projects/, and sitemap.xml from ArcGIS on every
  # deploy (see aln-static-generator/build.js - config.siteOutputDir points
  # at the repo root), then publishes the repo root as before.
  command = "cd aln-static-generator && npm install && node build.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
