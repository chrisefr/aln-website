[build]
  # Regenerates individuals/, projects/, and sitemap.xml from ArcGIS on every
  # deploy (see aln-static-generator/build.js - config.siteOutputDir points
  # at the repo root), then publishes the repo root as before.
  command = "cd aln-static-generator && npm install && node build.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Always revalidate CSS with the server instead of caching it blindly for a
  # year (unlike images/*, style.css changes often during active development
  # and isn't versioned/renamed on change - immutable caching meant edits
  # wouldn't show up in a browser that had already visited the site).
  # "no-cache" still lets the browser cache the file; it just forces a quick
  # conditional request (fast 304 if unchanged) before using the cached copy.
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
